<title>FitHerNova</title>
<style>
:root{--pink:#ff2d6b;--pink-light:#ff6b9d;--pink-dark:#c4004d;--pink-glow:rgba(255,45,107,0.25);--gold:#ffd166;--black:#0d0d0d;--black2:#161616;--black3:#1e1e1e;--black4:#2a2a2a;--white:#ffffff;--grey:#8a8a8a;--grey2:#555;--green:#06d6a0;--font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--radius:16px;--radius-sm:10px;--safe-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;min-height:100%;overflow:hidden;background:var(--black);}
body{font-family:var(--font-body);color:var(--white);overscroll-behavior:none;width:100vw;}
button,input,select{font:inherit;}
.auth-loading{position:fixed;inset:0;z-index:3000;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.auth-loading .logo-big{font-family:var(--font-head);font-size:38px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.auth-loading .spinner{width:32px;height:32px;border:3px solid var(--black4);border-top-color:var(--pink);border-radius:50%;animation:spin 0.8s linear infinite;}
.auth-loading p{font-size:13px;color:var(--grey);}
@keyframes spin{to{transform:rotate(360deg);}}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;max-width:100vw;margin:0 auto;position:relative;background:var(--black);}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(160px + var(--safe-bottom));scrollbar-width:none;scroll-padding-bottom:160px;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{display:none;}
.page{display:none;padding:20px max(18px,env(safe-area-inset-left)) 110px max(18px,env(safe-area-inset-right));animation:fadeUp 0.3s ease;max-width:920px;width:100%;margin:0 auto;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.app-header{padding:14px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;max-width:920px;width:100%;margin:0 auto;overflow:visible;}
.logo{font-family:var(--font-head);font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;white-space:nowrap;flex-shrink:0;}
.logo-sub{font-size:9px;color:var(--grey);letter-spacing:1px;text-transform:uppercase;margin-top:-2px;white-space:nowrap;}
.header-streak{background:var(--black3);border:1px solid var(--black4);border-radius:99px;padding:5px 10px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(22,22,22,.96);backdrop-filter:blur(12px);border-top:1px solid var(--black4);display:flex;padding-bottom:var(--safe-bottom);z-index:100;box-shadow:0 -10px 30px rgba(0,0,0,.45);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;cursor:pointer;border:none;background:none;color:var(--grey);gap:3px;transition:color 0.2s;position:relative;}
.nav-item.active{color:var(--pink);}
.nav-item.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:linear-gradient(90deg,var(--pink),var(--pink-light));border-radius:0 0 4px 4px;}
.nav-item svg{width:22px;height:22px;stroke-width:1.8;}
.nav-label{font-size:10px;font-weight:500;letter-spacing:0.3px;}
.card{background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-pink{background:linear-gradient(135deg,var(--pink-dark),var(--pink));border:none;}
.sec-label{font-family:var(--font-head);font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-family:var(--font-body);font-weight:500;transition:all 0.2s;border-radius:var(--radius-sm);}
.btn-pink{background:linear-gradient(135deg,var(--pink),var(--pink-light));color:#fff;height:46px;font-size:14px;width:100%;box-shadow:0 4px 20px var(--pink-glow);}
.btn-pink:hover{transform:translateY(-1px);box-shadow:0 6px 28px var(--pink-glow);}
.btn-pink:active{transform:translateY(0);}
.btn-ghost{background:var(--black3);border:1px solid var(--black4);color:var(--white);height:40px;font-size:13px;padding:0 16px;}
.btn-ghost:hover{border-color:var(--grey2);}
.btn-danger{background:#2a0a0f;border:1px solid #5c1a25;color:#ff6b6b;height:40px;font-size:13px;padding:0 16px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],select{background:var(--black3);border:1px solid var(--black4);border-radius:var(--radius-sm);color:var(--white);font-family:var(--font-body);font-size:14px;padding:0 12px;height:44px;width:100%;outline:none;transition:border-color 0.2s;}
input:focus,select:focus{border-color:var(--pink);}
input::placeholder{color:var(--grey2);}
select option{background:var(--black3);}
.auth-screen{position:fixed;inset:0;z-index:2000;background:radial-gradient(circle at top left,rgba(255,45,107,.18),transparent 32%),radial-gradient(circle at bottom right,rgba(255,209,102,.10),transparent 34%),var(--black);display:flex;align-items:center;justify-content:center;padding:22px;}
.auth-card{width:min(440px,100%);background:rgba(22,22,22,.96);border:1px solid var(--black4);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.55);}
.auth-logo{font-family:var(--font-head);font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;}
.auth-sub{font-size:13px;color:var(--grey);margin:4px 0 18px;line-height:1.45;}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;background:var(--black3);border:1px solid var(--black4);border-radius:14px;padding:5px;}
.auth-tab{border:0;background:transparent;color:var(--grey);height:38px;border-radius:10px;font-weight:700;cursor:pointer;}
.auth-tab.active{background:linear-gradient(135deg,var(--pink),var(--pink-light));color:white;}
.auth-form{display:flex;flex-direction:column;gap:10px;}
.auth-message{min-height:18px;font-size:12px;color:var(--gold);line-height:1.35;margin-top:4px;}
.auth-small{font-size:11px;color:var(--grey);text-align:center;margin-top:12px;line-height:1.45;}
.user-pill{background:var(--black3);border:1px solid var(--black4);border-radius:99px;padding:6px 10px;font-size:11px;color:var(--grey);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.user-pill button{background:transparent;border:0;color:var(--pink-light);font-weight:700;cursor:pointer;font-size:11px;}
@media(min-width:700px){.stats-row{grid-template-columns:repeat(4,1fr)}.food-item,.workout-card,.card,.detail-card,.ring-section{border-radius:20px}.logo{font-size:30px}.page{padding-left:28px;padding-right:28px}.app-header{padding-left:28px;padding-right:28px}}
@media(max-width:430px){.nav-label{font-size:9px}.nav-item svg{width:20px;height:20px}.header-streak{font-size:10px;padding:5px 8px}.logo{font-size:22px;letter-spacing:0px}.app-header{align-items:center;padding:12px 12px 0 12px}/* .user-pill display:none removed – always show logout */}
@media(max-width:360px){.logo{font-size:19px}.header-streak{display:none}}
.greeting{font-family:var(--font-head);font-size:22px;font-weight:700;margin-bottom:2px;}
.greeting span{background:linear-gradient(135deg,var(--pink),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub-greeting{font-size:13px;color:var(--grey);margin-bottom:18px;}
.ring-section{display:flex;align-items:center;gap:16px;background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.ring-wrap{position:relative;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-cal{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--white);}
.ring-sub{font-size:10px;color:var(--grey);margin-top:1px;}
.ring-info{flex:1;}
.ring-info-row{display:flex;justify-content:space-between;margin-bottom:8px;}
.rir-label{font-size:11px;color:var(--grey);}
.rir-val{font-size:11px;font-weight:600;color:var(--white);}
.mini-prog{height:4px;background:var(--black4);border-radius:99px;overflow:hidden;margin-top:3px;}
.mini-fill{height:100%;border-radius:99px;transition:width 0.6s ease;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.stat-tile{background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;}
.stat-tile .sv{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--white);}
.stat-tile .sl{font-size:9px;color:var(--grey);margin-top:2px;letter-spacing:0.3px;}
.quick-start{background:linear-gradient(135deg,#1a0a10,#2a0d18);border:1px solid #3d1525;border-radius:var(--radius);padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.qs-text .qt{font-family:var(--font-head);font-size:14px;font-weight:700;}
.qs-text .qs{font-size:12px;color:var(--grey);margin-top:2px;}
.qs-btn{background:linear-gradient(135deg,var(--pink),var(--pink-light));border:none;color:#fff;border-radius:var(--radius-sm);padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.meal-log-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--black4);}
.meal-log-item:last-child{border-bottom:none;}
.mli-left{display:flex;align-items:center;gap:8px;font-size:13px;}
.mli-cal{font-size:13px;font-weight:600;color:var(--pink-light);}
/* Coach Nova challenge card — lively daily motivation */
.daily-quote-card{background:radial-gradient(circle at 12% 0%,rgba(255,45,107,.34),transparent 34%),radial-gradient(circle at 95% 10%,rgba(255,209,102,.18),transparent 30%),linear-gradient(135deg,#1a0710,#07070b);border:1px solid rgba(255,45,107,.45);border-radius:22px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 14px 42px rgba(255,45,107,.12);}
.daily-quote-card:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(255,255,255,.055),transparent);transform:translateX(-120%);animation:coachShine 5.5s ease-in-out infinite;pointer-events:none;}
@keyframes coachShine{0%,62%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.daily-quote-card .sec-label{color:rgba(255,255,255,.72);font-size:10px;letter-spacing:1.7px;}
.daily-quote-text{font-size:13px;line-height:1.65;color:var(--white);position:relative;z-index:1;}
.daily-quote-loading{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey);}
.daily-quote-spinner{width:14px;height:14px;border:2px solid var(--black4);border-top-color:var(--pink);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
.coach-challenge-kicker{display:inline-flex;align-items:center;gap:6px;background:rgba(255,45,107,.18);border:1px solid rgba(255,45,107,.35);color:var(--pink-light);font-size:10px;font-weight:900;letter-spacing:.8px;border-radius:999px;padding:5px 9px;margin-bottom:9px;text-transform:uppercase;}
.coach-challenge-line{font-family:var(--font-head);font-size:17px;font-weight:800;line-height:1.25;color:#fff;letter-spacing:-.25px;margin-bottom:7px;}
.coach-challenge-sub{font-size:12px;color:rgba(255,255,255,.68);line-height:1.55;margin-bottom:12px;}
.coach-challenge-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.coach-mission-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.28);color:var(--gold);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;}
.coach-refresh-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;cursor:pointer;}
.coach-refresh-btn:hover{border-color:rgba(255,45,107,.5);color:#fff;background:rgba(255,45,107,.12);}
/* pro card dismiss */
.pro-inline-card{border-radius:22px;padding:15px;background:linear-gradient(135deg,#1a0710,#101010);border:1px solid rgba(255,45,107,.24);margin-bottom:12px;position:relative;}
.pro-inline-title{font-family:var(--font-head);font-size:16px;font-weight:900;margin-bottom:4px;}
.pro-inline-sub{font-size:12px;color:rgba(255,255,255,.62);line-height:1.45;margin-bottom:10px;}
.pro-dismiss-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--grey);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px;border-radius:50%;}
.pro-dismiss-btn:hover{color:var(--white);background:var(--black4);}
/* food */
.filter-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none;}
.filter-scroll::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:6px 14px;border-radius:99px;border:1px solid var(--black4);background:var(--black3);color:var(--grey);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;}
.chip.active{background:var(--pink);border-color:var(--pink);color:#fff;}
.food-item{display:flex;align-items:center;justify-content:space-between;background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:border-color 0.2s;}
.food-item:hover,.food-item:active{border-color:var(--grey2);}
.food-item.selected{border-color:var(--pink);background:#1a0810;}
.food-emoji{font-size:22px;width:36px;text-align:center;}
.food-name{font-size:13px;font-weight:500;color:var(--white);}
.food-meta{font-size:11px;color:var(--grey);margin-top:1px;}
.food-cal{font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--pink-light);}
.detail-card{background:#1a0810;border:1px solid var(--pink-dark);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.portion-control{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:12px;}
.portion-label{font-size:12px;color:var(--grey);}
.portion-stepper{height:44px;background:var(--black3);border:1px solid var(--black4);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 10px;min-width:190px;}
.portion-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--pink);background:#2a0a18;color:var(--pink-light);font-size:20px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.portion-btn:active{transform:scale(.94);}
.portion-value{font-size:13px;font-weight:700;color:var(--white);min-width:78px;text-align:center;}
@media(max-width:390px){.portion-control{grid-template-columns:1fr;}.portion-stepper{width:100%;min-width:0;}}
.macro-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;}
.mc{background:var(--black3);border-radius:var(--radius-sm);padding:8px;text-align:center;}
.mc .mv{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--white);}
.mc .ml{font-size:10px;color:var(--grey);margin-top:2px;}
.log-list-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--black4);font-size:13px;}
.log-list-item:last-child{border-bottom:none;}
.del-btn{background:none;border:none;color:var(--grey2);cursor:pointer;font-size:16px;padding:0 4px;}
.food-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:99px;margin-right:3px;margin-top:3px;font-weight:600;letter-spacing:0.3px;}
.food-tag-healthy{background:#0a2a1a;color:var(--green);}
.food-tag-highprotein{background:#1a0810;color:var(--pink-light);}
.food-tag-weightloss{background:#2a1a00;color:var(--gold);}
.show-more-foods{background:var(--black3);border:1px dashed var(--grey2);color:var(--grey);height:40px;font-size:13px;width:100%;margin-top:4px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.2s;}
.show-more-foods:hover{border-color:var(--pink);color:var(--pink-light);}
/* workout */
.workout-card{background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color 0.2s;}
.workout-card:hover{border-color:var(--grey2);}
.workout-card.open{border-color:var(--pink);}
.wc-top{display:flex;align-items:center;justify-content:space-between;}
.wc-icon{font-size:24px;width:42px;height:42px;background:var(--black3);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wc-title{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--white);}
.wc-meta{font-size:11px;color:var(--grey);margin-top:2px;}
.badge{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:600;letter-spacing:0.3px;}
.badge-easy{background:#0a2a1a;color:var(--green);}
.badge-med{background:#2a1a00;color:var(--gold);}
.badge-hard{background:#2a0a0f;color:#ff6b6b;}
.badge-gentle{background:#0a1a2a;color:#6bb5ff;}
.ex-list{margin-top:12px;display:none;}
.ex-list.open{display:block;}
.ex-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--black4);}
.ex-num{width:20px;height:20px;border-radius:50%;background:var(--black4);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--grey);flex-shrink:0;}
.ex-name{font-size:13px;color:var(--white);flex:1;}
.ex-reps{font-size:11px;color:var(--pink-light);font-weight:500;}
/* timer */
.timer-page{text-align:center;}
.timer-workout-name{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--pink);background:#1a0810;border:1px solid var(--pink-dark);border-radius:99px;display:inline-block;padding:6px 18px;margin-bottom:20px;}
.timer-ring-wrap{position:relative;width:200px;height:200px;margin:0 auto 20px;}
.timer-ring-wrap svg{transform:rotate(-90deg);}
.timer-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.timer-digits{font-family:var(--font-head);font-size:44px;font-weight:800;letter-spacing:2px;color:var(--white);}
.timer-state{font-size:11px;color:var(--grey);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.timer-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.ts{background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius-sm);padding:10px;text-align:center;}
.ts .tv{font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--white);}
.ts .tl{font-size:10px;color:var(--grey);margin-top:2px;}
.timer-btns{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.tbtn{height:48px;padding:0 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:var(--font-body);display:flex;align-items:center;gap:6px;}
.tbtn-go{background:linear-gradient(135deg,var(--pink),var(--pink-light));color:#fff;box-shadow:0 4px 20px var(--pink-glow);}
.tbtn-pause{background:var(--black3);border:1px solid var(--black4);color:var(--white);}
.tbtn-stop{background:#2a0a0f;border:1px solid #5c1a25;color:#ff6b6b;}
.pick-label{font-size:12px;color:var(--grey);margin-bottom:8px;text-align:left;}
.pick-item{display:flex;align-items:center;gap:10px;background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:all 0.2s;}
.pick-item:hover{border-color:var(--grey2);}
.pick-item.selected{border-color:var(--pink);background:#1a0810;}
.pick-icon{font-size:20px;}
.pick-name{font-size:13px;font-weight:500;color:var(--white);flex:1;}
.pick-rate{font-size:11px;color:var(--pink-light);}
.result-banner{background:linear-gradient(135deg,#1a0a10,#0a1a10);border:1px solid var(--pink-dark);border-radius:var(--radius);padding:16px;margin-bottom:14px;display:none;text-align:center;}
.rb-title{font-family:var(--font-head);font-size:18px;font-weight:800;margin-bottom:10px;}
.rb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.rb-stat{background:var(--black3);border-radius:var(--radius-sm);padding:10px;}
.rb-val{font-family:var(--font-head);font-size:18px;font-weight:700;color:var(--pink-light);}
.rb-lbl{font-size:10px;color:var(--grey);margin-top:2px;}
.rb-msg{font-size:13px;color:var(--green);}
/* music */
.music-hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;margin-bottom:14px;background:radial-gradient(circle at 20% 10%,rgba(255,45,107,.42),transparent 32%),radial-gradient(circle at 85% 15%,rgba(255,209,102,.26),transparent 28%),linear-gradient(145deg,#230715,#080808 58%,#14040b);border:1px solid rgba(255,45,107,.28);box-shadow:0 22px 70px rgba(0,0,0,.55),0 0 35px rgba(255,45,107,.12);}
.music-hero:before{content:'';position:absolute;inset:-2px;background:linear-gradient(120deg,transparent,rgba(255,255,255,.06),transparent);transform:translateX(-100%);animation:shineNova 6s infinite;pointer-events:none;}
@keyframes shineNova{0%,65%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.music-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:relative;z-index:1;}
.music-badge{font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:rgba(255,45,107,.24);border:1px solid rgba(255,45,107,.4);border-radius:999px;padding:6px 10px;}
.music-live{font-size:10px;color:var(--gold);background:rgba(255,209,102,.10);border:1px solid rgba(255,209,102,.22);border-radius:999px;padding:6px 10px;white-space:nowrap;}
.dj-toggle{border:1px solid rgba(255,209,102,.32);background:rgba(255,209,102,.12);color:var(--gold);border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;letter-spacing:.4px;cursor:pointer;white-space:nowrap;}
.dj-toggle.on{background:linear-gradient(135deg,rgba(255,45,107,.32),rgba(255,209,102,.18));border-color:rgba(255,45,107,.45);color:#fff;box-shadow:0 0 18px rgba(255,45,107,.18);}
.music-stage{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center;position:relative;z-index:1;}
@media(max-width:520px){.music-stage{grid-template-columns:1fr;text-align:center}.vinyl-wrap{margin:0 auto}.premium-controls{justify-content:center}.music-meta-line{justify-content:center}}
.vinyl-wrap{position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center;}
.vinyl-disc{width:118px;height:118px;border-radius:50%;background:repeating-radial-gradient(circle at center,#111 0,#111 7px,#1c1c1c 8px,#1c1c1c 11px),linear-gradient(135deg,#000,#222);box-shadow:inset 0 0 0 8px rgba(255,255,255,.025),0 18px 35px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;transition:transform .3s ease;}
.vinyl-disc.spinning{animation:spin 4.5s linear infinite;}
.vinyl-label{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 0 8px rgba(0,0,0,.35);}
.music-info{min-width:0;}
.music-title{font-family:var(--font-head);font-size:22px;font-weight:900;line-height:1.05;letter-spacing:-.6px;color:#fff;margin-bottom:5px;}
.music-artist{font-size:13px;color:rgba(255,255,255,.68);margin-bottom:10px;}
.music-meta-line{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.music-pill{font-size:10px;color:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.06);border-radius:999px;padding:5px 8px;}
.premium-progress{height:7px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;cursor:pointer;margin-bottom:7px;}
.premium-progress .progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:999px;box-shadow:0 0 18px rgba(255,45,107,.55);}
.premium-time{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.55);margin-bottom:14px;}
.premium-controls{display:flex;align-items:center;gap:13px;}
.premium-controls .pbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;}
.premium-controls .pbtn-main{width:58px;height:58px;background:linear-gradient(135deg,var(--pink),var(--pink-light));border:none;box-shadow:0 10px 34px rgba(255,45,107,.38);}
.music-status{margin-top:12px;font-size:12px;color:rgba(255,255,255,.62);line-height:1.4;position:relative;z-index:1;}
.playlist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;}
.refresh-music-btn{height:34px;border:none;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:800;padding:0 12px;cursor:pointer;}
.track-item{border-radius:16px;background:linear-gradient(135deg,#171717,#101010);display:flex;align-items:center;gap:12px;border:1px solid var(--black4);padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:all 0.2s;}
.track-item:hover{border-color:var(--grey2);}
.track-item.playing{border-color:rgba(255,45,107,.75);background:#1a0810;box-shadow:0 0 24px rgba(255,45,107,.14);}
.track-num{font-size:12px;color:var(--grey);width:18px;text-align:center;}
.track-info{flex:1;}
.track-name{font-size:13px;font-weight:500;color:var(--white);}
.track-artist{font-size:11px;color:var(--grey);margin-top:1px;}
.track-dur{font-size:11px;color:var(--grey2);}
.playing-anim{display:none;align-items:flex-end;gap:2px;height:16px;}
.track-item.playing .playing-anim{display:flex;}
.track-item.playing .track-num{display:none;}
.bar-anim{width:3px;background:var(--pink);border-radius:2px;animation:barBounce 0.8s ease infinite;}
.bar-anim:nth-child(2){animation-delay:0.15s;}
.bar-anim:nth-child(3){animation-delay:0.3s;}
@keyframes barBounce{0%,100%{height:4px;}50%{height:14px;}}
/* progress */
.prog-header{display:flex;gap:10px;margin-bottom:12px;}
.prog-stat-big{flex:1;background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius);padding:14px;text-align:center;}
.psb-val{font-family:var(--font-head);font-size:24px;font-weight:800;}
.psb-val.pink{color:var(--pink);}
.psb-val.green{color:var(--green);}
.psb-val.gold{color:var(--gold);}
.chart-area{display:flex;align-items:flex-end;gap:5px;height:90px;padding:0 4px;}
.chart-wrap{background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.milestone-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--black4);}
.milestone-item:last-child{border-bottom:none;}
.mi-icon{font-size:22px;width:36px;text-align:center;}
.mi-name{font-size:13px;font-weight:500;color:var(--white);flex:1;}
.mi-sub{font-size:11px;color:var(--grey);margin-top:1px;}
.mi-badge{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:600;}
.mi-badge.earned{background:#0a2a1a;color:var(--green);}
.mi-badge.locked{background:var(--black4);color:var(--grey2);}
/* leaderboard */
.leaderboard-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--black4);}
.leaderboard-row:last-child{border-bottom:none;}
.lb-rank{font-family:var(--font-head);font-size:16px;font-weight:800;width:26px;text-align:center;}
.lb-name{flex:1;font-size:13px;}
.lb-streak{font-size:13px;font-weight:600;color:var(--pink-light);}
/* progress photos */
.progress-photo-slot{height:130px;background:var(--black3);border-radius:var(--radius-sm);border:1px dashed var(--black4);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color 0.2s;}
.progress-photo-slot:hover{border-color:var(--grey2);}
.progress-photo-slot img{width:100%;height:100%;object-fit:cover;}
/* reminders */
.reminder-freq{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
.freq-card{background:var(--black3);border:1px solid var(--black4);border-radius:var(--radius-sm);padding:10px;cursor:pointer;text-align:center;transition:all 0.2s;}
.freq-card.active{border-color:var(--pink);background:#1a0810;}
.freq-card .fi{font-size:18px;margin-bottom:4px;}
.freq-card .fl{font-size:12px;font-weight:500;color:var(--white);}
.freq-card .fs{font-size:10px;color:var(--grey);margin-top:2px;}
.reminder-item{display:flex;align-items:center;justify-content:space-between;background:var(--black2);border:1px solid var(--black4);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;}
.toggle{position:relative;width:38px;height:22px;cursor:pointer;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--black4);border-radius:99px;transition:0.3s;}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--grey);border-radius:50%;transition:0.3s;}
.toggle input:checked+.toggle-slider{background:var(--pink);}
.toggle input:checked+.toggle-slider:before{transform:translateX(16px);background:#fff;}
/* notification toast */
.notif-toast{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);max-width:480px;width:100%;background:linear-gradient(135deg,#1a0810,#2a0d18);border-bottom:2px solid var(--pink);padding:14px 18px;z-index:999;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);display:flex;align-items:center;gap:12px;}
.notif-toast.show{transform:translateX(-50%) translateY(0);}
.nt-icon{font-size:24px;}
.nt-text{flex:1;}
.nt-title{font-size:14px;font-weight:600;color:var(--white);}
.nt-sub{font-size:11px;color:var(--grey);margin-top:2px;}
.nt-btn{background:var(--pink);border:none;color:#fff;border-radius:var(--radius-sm);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
/* install banner */

.workout-preview-card{display:none;position:relative;overflow:hidden;border-radius:24px;padding:16px;margin:0 0 14px;background:radial-gradient(circle at 12% 0%,rgba(255,45,107,.30),transparent 35%),radial-gradient(circle at 100% 15%,rgba(255,209,102,.18),transparent 34%),linear-gradient(145deg,#18070f,#0f0f0f);border:1px solid rgba(255,45,107,.30);box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 28px rgba(255,45,107,.10);text-align:left;}
.workout-preview-card.show{display:block;animation:fadeUp .3s ease;}
.workout-preview-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.workout-preview-title{font-family:var(--font-head);font-size:18px;font-weight:900;letter-spacing:-.3px;color:#fff;}
.workout-preview-sub{font-size:12px;color:rgba(255,255,255,.62);line-height:1.45;margin-top:3px;}
.workout-preview-icon{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pink),var(--gold));font-size:26px;box-shadow:0 14px 35px rgba(255,45,107,.25);flex-shrink:0;}
.workout-preview-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;}
.workout-preview-stat{border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);padding:10px;text-align:center;}
.workout-preview-stat b{display:block;font-family:var(--font-head);font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.workout-preview-stat span{display:block;font-size:9px;color:var(--grey);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}
@media(max-width:560px){.workout-preview-stats{grid-template-columns:repeat(2,minmax(0,1fr));}}
.coach-live-card{display:none;border-radius:22px;padding:14px;margin:0 0 14px;background:linear-gradient(145deg,#130910,#0d0d0d);border:1px solid rgba(255,209,102,.18);text-align:left;}
.coach-live-card.show{display:block;animation:fadeUp .25s ease;}
.coach-live-kicker{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:rgba(255,209,102,.10);border:1px solid rgba(255,209,102,.22);color:var(--gold);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.coach-live-message{font-family:var(--font-head);font-size:16px;font-weight:800;color:#fff;line-height:1.35;}
.coach-live-sub{font-size:12px;color:rgba(255,255,255,.60);margin-top:5px;line-height:1.45;}
.workout-goal-card{border-radius:20px;padding:14px;margin-bottom:14px;background:linear-gradient(145deg,#171717,#101010);border:1px solid rgba(255,255,255,.08);text-align:left;}
.workout-goal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.workout-goal-title{font-family:var(--font-head);font-size:14px;font-weight:900;color:#fff;}
.workout-goal-value{font-size:11px;color:var(--pink-light);font-weight:900;border:1px solid rgba(255,45,107,.25);background:rgba(255,45,107,.10);border-radius:999px;padding:5px 9px;}
.workout-goal-track{height:8px;border-radius:999px;background:var(--black4);overflow:hidden;}
.workout-goal-track>div{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .45s ease;}
.workout-complete-boost{border-radius:22px;margin-top:12px;padding:12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);}
.reward-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.06);}
.reward-line:last-child{border-bottom:0;}
.reward-line b{color:var(--gold);}
.workout-badges-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px;}
.workout-badge{border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);padding:10px;text-align:center;opacity:.45;}
.workout-badge.earned{opacity:1;border-color:rgba(255,209,102,.34);background:linear-gradient(145deg,rgba(255,209,102,.09),rgba(255,45,107,.06));}
.workout-badge .bi{font-size:22px;margin-bottom:4px;}
.workout-badge .bt{font-family:var(--font-head);font-size:11px;font-weight:900;color:#fff;line-height:1.15;}
.workout-badge .bs{font-size:9px;color:var(--grey);margin-top:3px;}
@media(max-width:560px){.workout-badges-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}


/* ====== CLEAN PREMIUM NAV + HOME HUB UPGRADE ====== */
.bottom-nav{overflow:visible!important;justify-content:center!important;}
.nav-item{min-width:0!important;}
@media(max-width:430px){.nav-item{min-width:0!important}.nav-label{font-size:8.8px!important}.nav-item svg{width:19px!important;height:19px!important}}
.today-plan-card{position:relative;overflow:hidden;border-radius:26px;padding:16px;margin-bottom:12px;background:radial-gradient(circle at 12% 0%,rgba(255,45,107,.34),transparent 36%),radial-gradient(circle at 95% 8%,rgba(255,209,102,.20),transparent 33%),linear-gradient(145deg,#1a0710,#0e0e0e);border:1px solid rgba(255,45,107,.30);box-shadow:0 18px 54px rgba(0,0,0,.44),0 0 24px rgba(255,45,107,.10);}
.today-plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.today-plan-title{font-family:var(--font-head);font-size:20px;font-weight:900;letter-spacing:-.5px;color:#fff;line-height:1.1;}
.today-plan-sub{font-size:12px;color:rgba(255,255,255,.66);line-height:1.45;margin-top:4px;}
.today-plan-score{min-width:72px;text-align:center;border-radius:18px;padding:10px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.10);}
.today-plan-score b{display:block;font-family:var(--font-head);font-size:22px;color:var(--gold);line-height:1;}
.today-plan-score span{font-size:9px;color:var(--grey);text-transform:uppercase;letter-spacing:.6px;}
.today-plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.today-plan-pill{border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);padding:10px;}
.today-plan-pill b{display:block;font-size:12px;color:#fff;margin-bottom:3px;}
.today-plan-pill span{font-size:10px;color:rgba(255,255,255,.58);line-height:1.3;}
.quick-hub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.hub-btn{border:1px solid rgba(255,255,255,.08);background:linear-gradient(145deg,#171717,#101010);color:white;border-radius:18px;padding:12px 8px;cursor:pointer;text-align:center;min-height:74px;transition:.2s;}
.hub-btn:hover,.hub-btn:active{border-color:rgba(255,45,107,.45);background:#1a0810;transform:translateY(-1px);}
.hub-emoji{font-size:22px;margin-bottom:5px;}
.hub-label{font-size:11px;font-weight:900;font-family:var(--font-head);line-height:1.1;}
.hub-sub{font-size:9px;color:var(--grey);margin-top:3px;line-height:1.2;}
.pro-lock{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.25);color:var(--gold);padding:4px 7px;font-size:9px;font-weight:900;margin-top:7px;}
.fab-start{position:fixed;right:16px;bottom:calc(146px + var(--safe-bottom));z-index:130;border:0;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--pink-light));color:white;box-shadow:0 16px 42px rgba(255,45,107,.40),0 8px 24px rgba(0,0,0,.40);height:48px;padding:0 16px;font-size:12px;font-weight:900;display:flex;align-items:center;gap:7px;cursor:pointer;}
.fab-start:active{transform:scale(.96);}
@media(max-width:560px){.today-plan-grid{grid-template-columns:1fr}.quick-hub{grid-template-columns:repeat(2,minmax(0,1fr));}.fab-start{bottom:calc(136px + var(--safe-bottom));right:12px;height:44px;}}
